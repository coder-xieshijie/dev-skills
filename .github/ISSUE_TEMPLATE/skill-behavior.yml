name: Skill behavior or defect
description: A Skill did something you did not expect, or a script failed.
labels: ["bug"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - core-grill
        - core-spec
        - deliver
        - review-rules
        - mr-for-human
        - explain-as-fool
        - design-for-review
        - plan-for-agents
        - agent-prompt-rules
        - recon-to-contract
        - Several, or not sure
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you called
      description: The exact call, with its arguments.
      placeholder: /dev-skills:core-spec Write spec.md and verify.md from the decision summary
      render: text
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      description: Claude Code or Codex with its version, and the model and reasoning effort.
      placeholder: Claude Code 2.1.287, claude-opus-5-5, effort high
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dev-skills version or commit
      description: The plugin version from `claude plugin list` or the Codex plugin list, or the commit of your clone.
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the relevant output, file excerpts or session log. Remove anything private first.
    validations:
      required: true
