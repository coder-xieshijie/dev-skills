name: Skill checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node skills/agent-prompt-rules/scripts/check-links.mjs
      - run: node scripts/check-links.mjs
      - run: node --test skills/agent-prompt-rules/scripts/check-links.test.mjs
  deliver-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test skills/deliver/scripts/check-delivery.test.mjs
  core-spec-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test skills/core-spec/scripts/clauses.test.mjs
  repo-readiness-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The tests also run the kit's structure check (`verify.mjs check`) on the example map they build.
      - run: node --test skills/repo-readiness/assets/verify-skill/scripts/test/*.test.mjs
