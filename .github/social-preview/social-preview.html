<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>dev-skills social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; }
  body { background: #f5f5f5; color: #2d3142; font-family: 'Geist', system-ui, sans-serif; }
  #capture { width: 1280px; height: 640px; padding: 84px 96px 72px; display: flex; flex-direction: column; position: relative; }
  #capture::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #eb6c36; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 17px; font-weight: 500; letter-spacing: 0.2em;
             text-transform: uppercase; color: #4f5d75; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 112px; line-height: 1; letter-spacing: -0.02em;
       margin-top: 22px; }
  .tagline { font-size: 33px; line-height: 1.32; font-weight: 500; margin-top: 26px; max-width: 1040px; }
  .tagline em { font-style: normal; color: #eb6c36; }
  .flow { display: flex; align-items: center; gap: 0; margin-top: auto; }
  .step { border: 1px solid rgba(45,49,66,0.28); background: #ffffff; border-radius: 6px; padding: 16px 22px 14px; min-width: 200px; }
  .step.end { background: rgba(235,108,54,0.08); border-color: #eb6c36; }
  .step b { display: block; font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 500; }
  .step span { display: block; font-size: 16px; color: #4f5d75; margin-top: 6px; }
  .arrow { width: 44px; height: 2px; background: #4f5d75; position: relative; margin: 0 10px; }
  .arrow::after { content: ""; position: absolute; right: -2px; top: -5px; border-left: 10px solid #4f5d75;
                  border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .url { position: absolute; right: 96px; top: 88px; font-family: 'Geist Mono', monospace; font-size: 17px; color: #7a8399; }
</style>
</head>
<body>
<div id="capture">
  <div class="eyebrow">Agent Skills · Production-grade</div>
  <div class="url">github.com/coder-xieshijie/dev-skills</div>
  <h1>dev-skills</h1>
  <p class="tagline">From requirement to a <em>verified, mergeable</em> pull request.</p>
  <div class="flow">
    <div class="step"><b>core-grill</b><span>settle the decisions</span></div>
    <div class="arrow"></div>
    <div class="step"><b>core-spec</b><span>fix acceptance criteria</span></div>
    <div class="arrow"></div>
    <div class="step"><b>deliver</b><span>build, prove, verify</span></div>
    <div class="arrow"></div>
    <div class="step end"><b>pull request</b><span>you review and merge</span></div>
  </div>
</div>
</body>
</html>
